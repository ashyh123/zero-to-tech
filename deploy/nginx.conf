# 新版静态博客模板：按实际域名和目录调整，并保留服务器已有 HTTPS 配置。
# 自动发布把 current 链接指向一份完整的 releases/ 构建。
server {
    listen 80;
    server_name example.com www.example.com;
    root /var/www/agent-journey/current;
    index index.html;

    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    location /_astro/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
}
